[package]
name = "lurelia"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "An exploration game about places with a past: each world is a written history played out over the land."
readme = "README.md"
keywords = ["game", "voxel", "exploration", "wgpu", "procedural-generation"]
categories = ["games", "rendering"]

[dependencies]
wgpu = { version = "=25.0.2", default-features = false, features = ["vulkan", "dx12", "wgsl"] }
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
hecs = "0.11"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "=0.1.14"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
codegen-units = 16
incremental = true

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = false
incremental = false

[dev-dependencies]
# Same version wgpu 25.0.2 uses, so the lockfile gains nothing new; the
# shader test parses and validates every WGSL module with it.
naga = { version = "=25.0.1", features = ["wgsl-in"] }
